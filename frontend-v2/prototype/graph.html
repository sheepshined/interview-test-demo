<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识图谱 · AI 模拟面试官</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/interactions.css">
<style>
  /* 图例 */
  .legend { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); }
  .legend + .legend { margin-left: 16px; }
  .lg-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .lg-dot.note { background: var(--indigo-ink); }
  .lg-dot.file { background: var(--pine); }
  .lg-dot.url { background: var(--ochre); }
  .lg-dot.virtual { background: var(--ink-4); }
  .lg-line { display: inline-block; width: 22px; height: 0; border-top: 1px solid var(--ink-3); }
  .lg-line.dash { border-top-style: dashed; }

  /* 控制条 */
  .graph-controls {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .switch { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .switch input { appearance: none; width: 34px; height: 18px; border: 1px solid var(--line-strong); position: relative; transition: all var(--dur-2) ease; cursor: pointer; }
  .switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--ink-4); transition: all var(--dur-2) var(--ease); }
  .switch input:checked { border-color: var(--vermilion); background: var(--verm-wash); }
  .switch input:checked::after { left: 17px; background: var(--vermilion); }
  .ctl-sep { width: 1px; height: 20px; background: var(--line); }

  /* 画布 */
  .graph-wrap { position: relative; border: 1px solid var(--line-strong); background: var(--sheet); overflow: hidden; }
  .graph-wrap::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: .55;
  }
  .cy { position: relative; width: 100%; height: clamp(460px, 62vh, 660px); }

  .gedge { fill: none; stroke: rgba(23,21,15,.28); stroke-width: 1.1; }
  .gedge.sem { stroke: rgba(23,21,15,.16); stroke-dasharray: 4 6; animation: dashflow 5s linear infinite; }
  @keyframes dashflow { to { stroke-dashoffset: -100; } }
  .gnode { cursor: pointer; }
  .gnode circle { transform-box: fill-box; transform-origin: center; transition: transform var(--dur-2) var(--ease); }
  .gnode:hover circle { transform: scale(1.32); }
  .gnode .ring { fill: none; stroke-opacity: .5; }
  .gnode.virtual circle { fill: var(--paper); stroke: var(--ink-4); stroke-width: 1.4; stroke-dasharray: 3 3; }
  .glabel { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink-2); letter-spacing: 0.04em; pointer-events: none; }
  .gnode:hover + .glabel, .glabel.hot { fill: var(--ink); }
  .gpulse { fill: none; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: gpulse 3.4s ease-out infinite; }
  @keyframes gpulse { 0% { transform: scale(.6); opacity: .55; } 100% { transform: scale(1.5); opacity: 0; } }

  /* 悬浮详情 */
  .node-card {
    position: absolute; right: 20px; bottom: 20px;
    width: 260px; padding: 16px 18px;
    border: 1px solid var(--line-strong); background: var(--sheet);
    box-shadow: var(--sh-sheet);
    transition: opacity var(--dur-2) ease, transform var(--dur-2) var(--ease);
  }
  .node-card .t { font-family: var(--f-display); font-weight: 900; font-size: 15px; margin-bottom: 8px; }
  .node-card .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); padding: 3px 0; }
  .node-card .row b { font-family: var(--f-mono); font-weight: 700; color: var(--ink); }
  .node-card .hintx { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4); }

  /* 状态条 */
  .graph-stats {
    position: absolute; left: 20px; bottom: 20px;
    display: flex; gap: 18px; padding: 10px 16px;
    border: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(6px);
    font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  }
  .graph-stats b { color: var(--ink); font-weight: 700; }
</style>
</head>
<body data-shell="app" data-page="graph">

<div class="shell">
  <aside class="rail"></aside>
  <div class="rail-scrim"></div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:14px">
        <button class="icon-btn rail-toggle" aria-label="菜单"><span data-ic="menu"></span></button>
        <div class="crumb"><span>卷·06</span><span class="sep">/</span><b>知识图谱</b></div>
      </div>
      <div class="topbar-actions">
        <button class="tlink" id="rebuildBtn"><span data-ic="refresh"></span>重建索引</button>
        <button class="tlink" id="relayoutBtn"><span data-ic="network"></span>重新布局</button>
      </div>
    </div>

    <div class="page-body">
      <div class="page-head rv">
        <span class="sec-index">KNOWLEDGE GRAPH</span>
        <h1 class="page-title" style="margin-top:14px">知识图谱</h1>
        <p class="page-sub" style="margin-bottom:16px">节点大小 = 连接数；实线为 [[双链]]，虚线为语义关联；灰度虚线框表示尚未创建的笔记。</p>
        <div>
          <span class="legend"><span class="lg-dot note"></span>笔记</span>
          <span class="legend"><span class="lg-dot file"></span>文件</span>
          <span class="legend"><span class="lg-dot url"></span>网址</span>
          <span class="legend"><span class="lg-dot virtual"></span>未创建</span>
          <span class="legend" style="margin-left:16px"><span class="lg-line"></span>双链</span>
          <span class="legend"><span class="lg-line dash"></span>语义</span>
        </div>
      </div>

      <!-- 控制条 -->
      <div class="graph-controls rv" data-d="0.06s">
        <label class="switch"><input type="checkbox" id="semToggle" checked />显示语义边</label>
        <label class="switch"><input type="checkbox" id="isolatedToggle" />隐藏孤立节点</label>
        <span class="ctl-sep"></span>
        <span class="mono">分类筛选</span>
        <div class="chips" style="display:flex; gap:8px; flex-wrap:wrap" id="catChips"></div>
      </div>

      <!-- 画布 -->
      <div class="graph-wrap rv" data-d="0.12s">
        <div class="cy" id="cy"></div></div>
            <div class="row"><span>类型</span><b id="ncType">笔记 · 大模型</b></div>
            <div class="row"><span>连接数</span><b id="ncLinks">6</b></div>
            <div class="row"><span>备注</span><b id="ncNote">中心节点</b></div>
            <div class="hintx" id="ncHint">悬停节点查看详情 · 点击进入笔记</div>
          </div>

          <div class="graph-stats" id="graphStat"><b>0</b> 节点</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/voice.js"></script>
<script src="assets/vendor/cytoscape.min.js"></script>
<script src="assets/js/interactions.js"></script>
<script src="assets/js/pages/graph.js?v=3"></script>
<script>
  /* 节点悬浮 → 详情卡 */
  const card = document.getElementById('nodeCard');
  const el = { t: document.getElementById('ncTitle'), ty: document.getElementById('ncType'), l: document.getElementById('ncLinks'), n: document.getElementById('ncNote') };
  document.querySelectorAll('.gnode').forEach((g) => {
    g.addEventListener('mouseenter', () => {
      el.t.textContent = g.dataset.title;
      el.ty.textContent = g.dataset.type;
      el.l.textContent = g.dataset.links;
      el.n.textContent = g.dataset.note;
      card.style.transform = 'translateY(0)';
      card.style.opacity = '1';
    });
    g.addEventListener('click', () => {
      if (g.classList.contains('virtual')) toast('这是一个尚未创建的笔记，可点击新建', 'plus');
      else toast(`打开笔记「${g.dataset.title}」`);
    });
  });
  card.style.opacity = '0.001';
  card.style.transform = 'translateY(8px)';

  /* 开关演示 */
  document.querySelectorAll('.switch input').forEach((cb) => cb.addEventListener('change', () => {
    toast(cb.checked ? '已开启该筛选' : '已关闭该筛选');
  }));
  document.querySelectorAll('.graph-controls .tag').forEach((t) => t.addEventListener('click', () => {
    t.classList.toggle('is-on');
    toast(t.classList.contains('is-on') ? '已加入筛选' : '已移出筛选');
  }));
</script>
</body>
</html>
