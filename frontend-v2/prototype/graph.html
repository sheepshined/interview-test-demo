<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>知识图谱 · AI 模拟面试官</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  /* 图例 */
  .legend { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); }
  .legend + .legend { margin-left: 16px; }
  .lg-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .lg-dot.note { background: var(--indigo-ink); }
  .lg-dot.file { background: var(--pine); }
  .lg-dot.url { background: var(--ochre); }
  .lg-dot.virtual { background: var(--ink-4); }
  .lg-line { display: inline-block; width: 22px; height: 0; border-top: 1px solid var(--ink-3); }
  .lg-line.dash { border-top-style: dashed; }

  /* 控制条 */
  .graph-controls {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .switch { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
  .switch input { appearance: none; width: 34px; height: 18px; border: 1px solid var(--line-strong); position: relative; transition: all var(--dur-2) ease; cursor: pointer; }
  .switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: var(--ink-4); transition: all var(--dur-2) var(--ease); }
  .switch input:checked { border-color: var(--vermilion); background: var(--verm-wash); }
  .switch input:checked::after { left: 17px; background: var(--vermilion); }
  .ctl-sep { width: 1px; height: 20px; background: var(--line); }

  /* 画布 */
  .graph-wrap { position: relative; border: 1px solid var(--line-strong); background: var(--sheet); overflow: hidden; }
  .graph-wrap::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity: .55;
  }
  .cy { position: relative; width: 100%; height: clamp(460px, 62vh, 660px); }

  .gedge { fill: none; stroke: rgba(23,21,15,.28); stroke-width: 1.1; }
  .gedge.sem { stroke: rgba(23,21,15,.16); stroke-dasharray: 4 6; animation: dashflow 5s linear infinite; }
  @keyframes dashflow { to { stroke-dashoffset: -100; } }
  .gnode { cursor: pointer; }
  .gnode circle { transform-box: fill-box; transform-origin: center; transition: transform var(--dur-2) var(--ease); }
  .gnode:hover circle { transform: scale(1.32); }
  .gnode .ring { fill: none; stroke-opacity: .5; }
  .gnode.virtual circle { fill: var(--paper); stroke: var(--ink-4); stroke-width: 1.4; stroke-dasharray: 3 3; }
  .glabel { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink-2); letter-spacing: 0.04em; pointer-events: none; }
  .gnode:hover + .glabel, .glabel.hot { fill: var(--ink); }
  .gpulse { fill: none; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: gpulse 3.4s ease-out infinite; }
  @keyframes gpulse { 0% { transform: scale(.6); opacity: .55; } 100% { transform: scale(1.5); opacity: 0; } }

  /* 悬浮详情 */
  .node-card {
    position: absolute; right: 20px; bottom: 20px;
    width: 260px; padding: 16px 18px;
    border: 1px solid var(--line-strong); background: var(--sheet);
    box-shadow: var(--sh-sheet);
    transition: opacity var(--dur-2) ease, transform var(--dur-2) var(--ease);
  }
  .node-card .t { font-family: var(--f-display); font-weight: 900; font-size: 15px; margin-bottom: 8px; }
  .node-card .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); padding: 3px 0; }
  .node-card .row b { font-family: var(--f-mono); font-weight: 700; color: var(--ink); }
  .node-card .hintx { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4); }

  /* 状态条 */
  .graph-stats {
    position: absolute; left: 20px; bottom: 20px;
    display: flex; gap: 18px; padding: 10px 16px;
    border: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(6px);
    font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  }
  .graph-stats b { color: var(--ink); font-weight: 700; }
</style>
</head>
<body data-shell="app" data-page="graph">

<div class="shell">
  <aside class="rail"></aside>
  <div class="rail-scrim"></div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:14px">
        <button class="icon-btn rail-toggle" aria-label="菜单"><span data-ic="menu"></span></button>
        <div class="crumb"><span>卷·06</span><span class="sep">/</span><b>知识图谱</b></div>
      </div>
      <div class="topbar-actions">
        <button class="tlink" onclick="toast('已重建：12 篇笔记向量 · 24 条语义关联','refresh')"><span data-ic="refresh"></span>重建索引</button>
        <button class="tlink" onclick="toast('已按力导布局重新排布','network')"><span data-ic="network"></span>重新布局</button>
      </div>
    </div>

    <div class="page-body">
      <div class="page-head rv">
        <span class="sec-index">KNOWLEDGE GRAPH</span>
        <h1 class="page-title" style="margin-top:14px">知识图谱</h1>
        <p class="page-sub" style="margin-bottom:16px">节点大小 = 连接数；实线为 [[双链]]，虚线为语义关联；灰度虚线框表示尚未创建的笔记。</p>
        <div>
          <span class="legend"><span class="lg-dot note"></span>笔记</span>
          <span class="legend"><span class="lg-dot file"></span>文件</span>
          <span class="legend"><span class="lg-dot url"></span>网址</span>
          <span class="legend"><span class="lg-dot virtual"></span>未创建</span>
          <span class="legend" style="margin-left:16px"><span class="lg-line"></span>双链</span>
          <span class="legend"><span class="lg-line dash"></span>语义</span>
        </div>
      </div>

      <!-- 控制条 -->
      <div class="graph-controls rv" data-d="0.06s">
        <label class="switch"><input type="checkbox" checked />显示语义边</label>
        <label class="switch"><input type="checkbox" />隐藏孤立节点</label>
        <span class="ctl-sep"></span>
        <span class="mono">分类筛选</span>
        <div class="chips" style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="tag is-on"><span data-ic="folder"></span>大模型 (6)</button>
          <button class="tag"><span data-ic="folder"></span>工程实践 (3)</button>
          <button class="tag"><span data-ic="folder"></span>求职 (3)</button>
        </div>
      </div>

      <!-- 画布 -->
      <div class="graph-wrap rv" data-d="0.12s">
        <div class="cy" id="cy">
          <svg viewBox="0 0 1000 620" style="width:100%; height:100%">
            <!-- 边 -->
            <g class="gedge">
              <path d="M220 300 L120 200"/><path d="M220 300 L140 400"/>
              <path d="M220 300 L300 180"/><path d="M220 300 L320 400"/>
              <path d="M220 300 L210 470"/>
              <path d="M520 160 L430 90"/><path d="M520 160 L620 90"/>
              <path d="M520 160 L560 260"/><path d="M560 260 L660 220"/>
              <path d="M830 300 L920 220"/><path d="M830 300 L900 400"/>
              <path d="M830 300 L760 420"/><path d="M760 420 L700 520"/>
              <path d="M520 160 L830 300"/>
            </g>
            <g class="gedge sem">
              <path d="M220 300 L830 300"/>
              <path d="M320 400 L760 420"/>
              <path d="M210 470 L700 520"/>
              <path d="M120 200 L520 160"/>
              <path d="M560 260 L830 300"/>
              <path d="M300 180 L430 90"/>
              <path d="M900 400 L760 420"/>
            </g>

            <!-- 簇 A · RAG -->
            <g class="gpulse"><circle cx="220" cy="300" r="26" stroke="rgba(217,58,31,.5)"/></g>
            <g class="gnode" data-title="RAG 流程" data-type="笔记 · 大模型" data-links="6" data-note="中心节点">
              <circle cx="220" cy="300" r="18" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="220" y="334" text-anchor="middle">RAG 流程</text>

            <g class="gnode" data-title="向量检索" data-type="笔记 · 大模型" data-links="4" data-note="含父文档检索要点">
              <circle cx="120" cy="200" r="12" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="120" y="228" text-anchor="middle">向量检索</text>

            <g class="gnode" data-title="BM25 + 向量混合检索" data-type="笔记 · 大模型" data-links="5" data-note="RRF 融合权重记录">
              <circle cx="140" cy="400" r="11" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="140" y="428" text-anchor="middle">BM25</text>

            <g class="gnode" data-title="分块策略" data-type="笔记 · 大模型" data-links="2" data-note="语义边界切分">
              <circle cx="300" cy="180" r="10" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="300" y="206" text-anchor="middle">分块策略</text>

            <g class="gnode" data-title="重排 Rerank" data-type="笔记 · 大模型" data-links="3" data-note="交叉编码器选型待补">
              <circle cx="320" cy="400" r="13" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="320" y="430" text-anchor="middle">重排</text>

            <g class="gnode" data-title="RAG 评估指标与评测集" data-type="手写笔记 · 大模型" data-links="3" data-note="面试报告入库">
              <circle cx="210" cy="470" r="9" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="210" y="496" text-anchor="middle">评测集</text>

            <!-- 簇 B · Transformer -->
            <g class="gpulse" style="animation-delay:1.1s"><circle cx="520" cy="160" r="30" stroke="rgba(35,64,92,.55)"/></g>
            <g class="gnode" data-title="Transformer 架构笔记" data-type="文件 · 大模型" data-links="5" data-note="PDF 导入 · 12 页">
              <circle cx="520" cy="160" r="20" fill="var(--pine)"/>
            </g>
            <text class="glabel" x="520" y="196" text-anchor="middle">Transformer</text>

            <g class="gnode" data-title="注意力机制" data-type="笔记 · 大模型" data-links="3" data-note="Q/K/V 与多头">
              <circle cx="430" cy="90" r="12" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="430" y="70" text-anchor="middle">注意力机制</text>

            <g class="gnode" data-title="位置编码" data-type="笔记 · 大模型" data-links="1" data-note="稀疏节点">
              <circle cx="620" cy="90" r="10" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="620" y="70" text-anchor="middle">位置编码</text>

            <g class="gnode" data-title="LoRA 微调" data-type="笔记 · 大模型" data-links="2" data-note="数据构造待补">
              <circle cx="560" cy="260" r="12" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="560" y="288" text-anchor="middle">微调</text>

            <g class="gnode" data-title="LoRA 参数配置" data-type="网址收藏 · 大模型" data-links="1" data-note="外部链接">
              <circle cx="660" cy="220" r="9" fill="var(--ochre)"/>
            </g>
            <text class="glabel" x="660" y="246" text-anchor="middle">LoRA</text>

            <!-- 簇 C · Agent -->
            <g class="gnode" data-title="Agent 设计笔记" data-type="笔记 · 工程实践" data-links="4" data-note="工具调用与规划">
              <circle cx="830" cy="300" r="16" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="830" y="332" text-anchor="middle">Agent</text>

            <g class="gnode" data-title="工具调用 Function Calling" data-type="笔记 · 大模型" data-links="3" data-note="schema 设计">
              <circle cx="920" cy="220" r="11" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="920" y="200" text-anchor="middle">工具调用</text>

            <g class="gnode" data-title="Memory 记忆设计" data-type="笔记 · 工程实践" data-links="2" data-note="短期 / 长期">
              <circle cx="900" cy="400" r="10" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="900" y="428" text-anchor="middle">Memory</text>

            <g class="gnode" data-title="LangGraph 人在回路" data-type="笔记 · 工程实践" data-links="4" data-note="interrupt 与 checkpoint">
              <circle cx="760" cy="420" r="13" fill="var(--indigo-ink)"/>
            </g>
            <text class="glabel" x="760" y="450" text-anchor="middle">LangGraph</text>

            <g class="gnode virtual" data-title="反幻觉数据契约" data-type="未创建 · 虚拟节点" data-links="2" data-note="点击可创建该笔记">
              <circle cx="700" cy="520" r="9"/>
            </g>
            <text class="glabel" x="700" y="546" text-anchor="middle">反幻觉契约</text>
          </svg>

          <!-- 悬浮详情 -->
          <div class="node-card" id="nodeCard">
            <div class="t" id="ncTitle">RAG 流程</div>
            <div class="row"><span>类型</span><b id="ncType">笔记 · 大模型</b></div>
            <div class="row"><span>连接数</span><b id="ncLinks">6</b></div>
            <div class="row"><span>备注</span><b id="ncNote">中心节点</b></div>
            <div class="hintx" id="ncHint">悬停节点查看详情 · 点击进入笔记</div>
          </div>

          <div class="graph-stats">
            <span><b>20</b> 节点</span>
            <span><b>1</b> 虚拟</span>
            <span><b>14</b> 双链</span>
            <span><b>7</b> 语义</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script>
  /* 节点悬浮 → 详情卡 */
  const card = document.getElementById('nodeCard');
  const el = { t: document.getElementById('ncTitle'), ty: document.getElementById('ncType'), l: document.getElementById('ncLinks'), n: document.getElementById('ncNote') };
  document.querySelectorAll('.gnode').forEach((g) => {
    g.addEventListener('mouseenter', () => {
      el.t.textContent = g.dataset.title;
      el.ty.textContent = g.dataset.type;
      el.l.textContent = g.dataset.links;
      el.n.textContent = g.dataset.note;
      card.style.transform = 'translateY(0)';
      card.style.opacity = '1';
    });
    g.addEventListener('click', () => {
      if (g.classList.contains('virtual')) toast('这是一个尚未创建的笔记，可点击新建', 'plus');
      else toast(`打开笔记「${g.dataset.title}」`);
    });
  });
  card.style.opacity = '0.001';
  card.style.transform = 'translateY(8px)';

  /* 开关演示 */
  document.querySelectorAll('.switch input').forEach((cb) => cb.addEventListener('change', () => {
    toast(cb.checked ? '已开启该筛选' : '已关闭该筛选');
  }));
  document.querySelectorAll('.graph-controls .tag').forEach((t) => t.addEventListener('click', () => {
    t.classList.toggle('is-on');
    toast(t.classList.contains('is-on') ? '已加入筛选' : '已移出筛选');
  }));
</script>
</body>
</html>
