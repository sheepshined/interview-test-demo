<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>岗位匹配 · AI 模拟面试官</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/interactions.css">
<style>
  /* 简历摘要条 */
  .resume-strip {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    padding: 18px 24px;
    border: 1px solid var(--line);
    background: var(--sheet-2);
    border-left: 3px solid var(--pine);
  }
  .resume-strip .who { display: flex; align-items: center; gap: 12px; }
  .resume-strip .stamp-mini {
    width: 42px; height: 42px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--ink); color: var(--paper);
    font-family: var(--f-display); font-weight: 900; font-size: 19px;
  }
  .resume-strip .name { font-family: var(--f-display); font-weight: 900; font-size: 17px; }
  .resume-strip .meta { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
  .resume-strip .skills { display: flex; gap: 7px; flex-wrap: wrap; margin-left: auto; }

  /* 岗位卡片 */
  .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 22px; margin-top: 34px; }
  .role-card { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 16px; position: relative; overflow: hidden; }
  .role-card .no { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink-4); }
  .role-card h3 { font-size: 20px; margin-top: -6px; }
  .role-card .tags { display: flex; gap: 7px; flex-wrap: wrap; }
  .role-card .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); }
  .role-card .match { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .role-card .match .row { display: flex; align-items: baseline; gap: 8px; }
  .role-card .match .pct { font-family: var(--f-mono); font-weight: 700; font-size: 24px; letter-spacing: -0.03em; }
  .role-card .match .k { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-4); }
  .role-card .bar { height: 4px; background: var(--line-soft); position: relative; }
  .role-card .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); transition: width 1s var(--ease); }
  .role-card.is-best .bar i { background: var(--vermilion); }
  .role-card.is-best { border-color: var(--line-strong); box-shadow: var(--sh-lift); }
  .role-card.is-best::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(320px 160px at 100% 0%, var(--verm-wash), transparent 70%);
  }

  .foot-note {
    margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4);
  }

  @media (max-width: 700px) { .resume-strip .skills { margin-left: 0; } }
</style>
</head>
<body data-shell="app" data-page="resume">

<div class="shell">
  <aside class="rail"></aside>
  <div class="rail-scrim"></div>

  <div class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:14px">
        <button class="icon-btn rail-toggle" aria-label="菜单"><span data-ic="menu"></span></button>
        <div class="crumb"><span>卷·03</span><span class="sep">/</span><b>岗位匹配</b></div>
      </div>
      <div class="topbar-actions">
        <a class="tlink" href="resume.html"><span data-ic="arrowLeft"></span>返回上传</a>
      </div>
    </div>

    <div class="page-body">
      <div class="page-head rv">
        <span class="sec-index">RESUME → ROLE</span>
        <h1 class="page-title" style="margin-top:14px">挑一个方向，开始练</h1>
        <p class="page-sub">按技能画像匹配到的岗位已排在最前，也可以选择其他方向——每张卡片都是一场完整面试。</p>
      </div>

      <div class="resume-strip rv" data-d="0.06s">
        <div class="who">
          <span class="stamp-mini">高</span>
          <span>
            <span class="name">高捷</span>
            <span class="meta" style="display:block">已完成简历分析 · 8 项技能</span>
          </span>
        </div>
        <div class="skills">
          <span class="tag">RAG</span><span class="tag">LangGraph</span><span class="tag">向量检索</span>
          <span class="tag">提示词工程</span><span class="tag">+5</span>
        </div>
      </div>

      <div class="role-grid" data-stagger id="roleGrid"></div>

      <div class="foot-note">
        <span>匹配度 = 技能与岗位标签的命中比例</span>
        <span>匹配度 = 技能命中岗位标签的比例 · 实时计算</span>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/voice.js"></script>
<script src="assets/js/interactions.js"></script>
<script>
  /* ── 真实岗位匹配：GET /api/roles + 简历技能 → 命中率排序 ── */
  (async () => {
    const grid = document.getElementById('roleGrid');
    const strip = document.querySelector('.resume-strip');
    const resume = window.IA.readResumeData();
    const skills = (resume && resume.skills) || [];

    if (strip) {
      strip.querySelector('.stamp-mini').textContent = (resume && resume.name || '我').charAt(0);
      strip.querySelector('.name').textContent = (resume && resume.name) || '求职者';
      strip.querySelector('.meta').textContent =
        resume ? '已完成简历分析 · ' + skills.length + ' 项技能' : '未检测到简历 · 仍可自主任选方向';
      strip.querySelector('.skills').innerHTML =
        (skills.slice(0, 4).map((t) => '<span class="tag">' + t + '</span>').join('')
          + (skills.length > 4 ? '<span class="tag">+' + (skills.length - 4) + '</span>' : ''))
        || '<span class="tag">通用方向</span>';
    }

    const res = await window.IA.getRoles();
    if (!res.success || !Array.isArray(res.roles) || !res.roles.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-title">岗位加载失败</div><div class="empty-sub">'
        + (res.message || '请确认后端已启动') + '</div></div>';
      return;
    }
    let roles = [...res.roles];
    const suggested = resume && resume.suggested_role;
    if (suggested) {
      const i = roles.findIndex((r) => r.key === suggested);
      if (i > 0) roles.unshift(roles.splice(i, 1)[0]);
    }

    grid.innerHTML = roles.map((role, idx) => {
      const tags = role.tags || [];
      const hit = tags.filter((t) => skills.some((s) => s.includes(t) || t.includes(s))).length;
      const pct = tags.length ? Math.round((hit / tags.length) * 100) : 50;
      const best = idx === 0;
      return '<article class="role-card sheet sheet-hover' + (best ? ' is-best' : '') + ' rv" data-meter>'
        + (best ? '<span class="corner-tag verm">推荐 · MATCH</span>' : '')
        + '<span class="no">№ 0' + (idx + 1) + '</span>'
        + '<h3>' + role.title + '</h3>'
        + '<div class="tags">' + tags.slice(0, 5).map((t) => '<span class="tag">' + t + '</span>').join('') + '</div>'
        + '<div class="foot"><div class="match"><div class="row"><span class="pct">' + pct
        + '</span><span class="k">% 匹配度</span></div><div class="bar"><i data-w="' + pct + '" style="width:0"></i></div></div>'
        + '<a class="btn btn-sm' + (best ? '' : ' btn-ghost') + '" href="interview.html" data-role-key="' + role.key
        + '" data-role-title="' + role.title + '">开始面试<span class="ar" data-ic="arrowRight"></span></a></div></article>';
    }).join('');
    if (window.renderIcons) renderIcons(grid);
    if (window.initReveal) initReveal();

    grid.addEventListener('click', (e) => {
      const a = e.target.closest('a[data-role-key]');
      if (!a) return;
      window.IA.writeConfig({
        key: a.dataset.roleKey,
        title: a.dataset.roleTitle,
        resumeContext: (resume && resume.resume_context) || '',
        resumeSkills: skills,
        questionCount: 5,
      });
      toast('已选定「' + a.dataset.roleTitle + '」');
    });
  })();
</script>
</body>
</html>
